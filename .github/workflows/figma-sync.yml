name: Figma sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      export:
        description: Icon names to export even if unchanged, separated by spaces
        required: false
        default: ""
      force:
        description: Sync even if the newest named version was synced before
        type: boolean
        default: false

concurrency:
  group: figma-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  SYNC_BRANCH: figma-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Find the version that waits for review
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_pull_requests=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq length)
          if ((open_pull_requests > 0)) && git fetch --depth=1 origin "$SYNC_BRANCH"; then
            echo "version=$(git show FETCH_HEAD:figma/manifest.json | jq -r '.version.id // empty')" >>"$GITHUB_OUTPUT"
          fi

      - name: Export icons from Figma
        id: sync
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          EXPORT_NAMES: ${{ inputs.export }}
          FORCE: ${{ inputs.force }}
          PENDING_VERSION: ${{ steps.pending.outputs.version }}
        run: |
          arguments=(--report "$RUNNER_TEMP/report.md")
          [[ -n $PENDING_VERSION ]] && arguments+=(--pending-version "$PENDING_VERSION")
          [[ $FORCE == true ]] && arguments+=(--force)
          [[ -n $EXPORT_NAMES ]] && arguments+=(--export $EXPORT_NAMES)
          python3 figma/sync.py "${arguments[@]}"

      - name: Open or update the pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.sync.outputs.label }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$SYNC_BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "The sync did not change any file."
            exit 0
          fi
          git commit -s -m "Sync icons from Figma version: $LABEL"
          if git fetch --depth=1 origin "$SYNC_BRANCH" && git diff --quiet FETCH_HEAD HEAD; then
            echo "The $SYNC_BRANCH branch already has these changes."
          else
            git push --force origin "$SYNC_BRANCH"
          fi
          if gh pr view "$SYNC_BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$SYNC_BRANCH" --title "Sync icons from Figma: $LABEL" --body-file "$RUNNER_TEMP/report.md"
          else
            gh pr create --head "$SYNC_BRANCH" --base main --title "Sync icons from Figma: $LABEL" --body-file "$RUNNER_TEMP/report.md"
          fi
